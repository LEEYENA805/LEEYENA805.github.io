'''html
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OOO | Digital Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#39352f;
      --paper:#fffdf6;
      --cream:#f5ecd8;
      --yellow:#f8d982;
      --blue:#c9e4e1;
      --pink:#f5c9c0;
      --line:2px solid #4f4a42
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      color:var(--ink);
      font-family:Pretendard,Arial,sans-serif;
      background:
        radial-gradient(#d7cfbf 1px,transparent 1px),
        var(--cream);
      background-size:11px 11px
    }

    .wrap{
      max-width:1250px;
      margin:auto;
      padding:22px
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px
    }

    .brand{
      font:42px 'Nanum Pen Script',cursive;
      letter-spacing:1px
    }

    .top-actions{
      display:flex;
      gap:10px
    }

    .btn{
      border:var(--line);
      background:var(--paper);
      padding:10px 15px;
      border-radius:4px;
      cursor:pointer;
      color:var(--ink);
      font:600 15px 'Gaegu',sans-serif;
      letter-spacing:.6px;
      box-shadow:3px 3px 0 #d8cfbd;
      transition:.18s
    }

    .btn:hover{
      transform:translate(-2px,-2px);
      box-shadow:5px 5px 0 var(--yellow)
    }

    .hero{
      border:var(--line);
      background:var(--paper);
      min-height:440px;
      display:grid;
      grid-template-columns:190px 1fr;
      box-shadow:7px 7px 0 #d8cfbd
    }

    .side{
      padding:23px 17px;
      border-right:var(--line);
      display:flex;
      flex-direction:column;
      gap:12px;
      background:rgba(250,247,237,.8)
    }

    .avatar{
      width:68px;
      height:68px;
      border:var(--line);
      border-radius:50%;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:#fff;
      margin-bottom:10px
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .navlink{
      background:none;
      border:0;
      text-align:left;
      cursor:pointer;
      font:700 17px 'Gaegu';
      color:var(--ink);
      padding:2px
    }

    .navlink:hover,
    .navlink.active{
      background:var(--yellow);
      transform:rotate(-1deg)
    }

    .hero-main{
      position:relative;
      padding:55px 7%;
      overflow:hidden
    }

    .spark{
      position:absolute;
      font:29px 'Gaegu';
      color:#c49762
    }

    .s1{right:12%;top:70px}
    .s2{right:25%;top:140px}

    .eyebrow,
    .section-title{
      font:25px 'Gaegu';
      letter-spacing:1px
    }

    .name{
      font:72px 'Nanum Pen Script';
      margin:5px 0 0
    }

    .role{
      font:28px 'Gaegu';
      line-height:1.1;
      margin:10px 0 28px
    }

    .doodle{
      position:absolute;
      right:7%;
      bottom:34px;
      font-size:105px;
      transform:rotate(-8deg);
      opacity:.82
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-top:20px
    }

    .section{
      border:var(--line);
      background:var(--paper);
      padding:25px;
      box-shadow:5px 5px 0 #d8cfbd;
      min-height:285px
    }

    .section-title{
      margin:0 0 16px;
      font-size:29px
    }

    .about{
      display:grid;
      grid-template-columns:150px 1fr;
      gap:22px
    }

    .profile-card{
      border:var(--line);
      height:180px;
      background:var(--pink);
      display:grid;
      place-items:center;
      overflow:hidden
    }

    .profile-card img{
      height:100%;
      width:100%;
      object-fit:cover
    }

    .profile-placeholder{
      font-size:76px
    }

    .about-text h3{
      font:25px 'Gaegu';
      margin:0 0 7px
    }

    .about-text p{
      line-height:1.75;
      margin:0
    }

    .strengths{
      grid-column:1/-1;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:9px
    }

    .strength{
      border:1.5px solid var(--ink);
      padding:10px;
      text-align:center;
      font:17px 'Gaegu'
    }

    .strength b{
      font-size:25px;
      display:block
    }

    .timeline{
      border-left:2px solid var(--ink);
      padding-left:22px;
      margin:8px
    }

    .timeline div{
      position:relative;
      margin:0 0 19px
    }

    .timeline div:before{
      content:'';
      position:absolute;
      width:11px;
      height:11px;
      border:2px solid var(--ink);
      background:var(--paper);
      border-radius:50%;
      left:-29px;
      top:4px
    }

    .timeline b{
      font:18px 'Gaegu'
    }

    .skills{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px
    }

    .paper-box{
      border:1.5px solid var(--ink);
      padding:11px;
      min-height:130px
    }

    .paper-box h3{
      font:18px 'Gaegu';
      margin:0 0 8px
    }

    .paper-box ul{
      padding-left:17px;
      line-height:1.8;
      margin:0;
      font-size:13px
    }

    .projects{
      grid-column:span 2
    }

    .project-list{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:11px
    }

    .project{
      border:1.5px solid var(--ink);
      padding:12px;
      min-height:175px;
      background:#fffcf3;
      cursor:pointer;
      transition:.2s
    }

    .project:hover{
      background:var(--yellow);
      transform:translateY(-4px)
    }

    .project .ico{
      font-size:40px
    }

    .project h3{
      font:19px 'Gaegu';
      margin:7px 0 4px
    }

    .project p{
      font-size:12px;
      margin:0;
      line-height:1.5
    }

    .growth{
      position:relative
    }

    .growth-flow{
      display:flex;
      align-items:center;
      justify-content:space-around;
      text-align:center;
      font:18px 'Gaegu';
      margin-top:35px
    }

    .growth-flow span{
      font-size:38px;
      display:block
    }

    .future{
      grid-column:span 2
    }

    .future-path{
      display:flex;
      align-items:center;
      justify-content:space-between;
      text-align:center;
      font:18px 'Gaegu';
      margin:37px 0
    }

    .future-path b{
      font-size:36px;
      display:block
    }

    .contact{
      text-align:center;
      display:flex;
      flex-direction:column;
      justify-content:center
    }

    .contact-links{
      display:flex;
      justify-content:center;
      gap:13px;
      flex-wrap:wrap
    }

    .contact-link{
      border:1.5px solid var(--ink);
      padding:10px;
      background:white;
      cursor:pointer;
      font:17px 'Gaegu'
    }

    .contact-link:hover{
      background:var(--blue)
    }

    .thanks{
      font:37px 'Nanum Pen Script';
      margin:23px 0 0
    }

    .modal{
      position:fixed;
      inset:0;
      background:#332f2b88;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:3
    }

    .modal.show{
      display:flex
    }

    .modal-box{
      width:min(500px,100%);
      background:var(--paper);
      border:var(--line);
      padding:25px;
      box-shadow:8px 8px 0 #3d3932
    }

    .modal-box h2{
      font:32px 'Gaegu';
      margin:0 0 15px
    }

    .modal-box label{
      display:block;
      font:18px 'Gaegu';
      margin-top:10px
    }

    .modal-box input,
    .modal-box textarea{
      width:100%;
      padding:9px;
      border:1.5px solid var(--ink);
      background:#fffef9;
      font:15px Pretendard
    }

    .modal-box textarea{
      height:80px;
      resize:vertical
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:9px;
      margin-top:17px;
      flex-wrap:wrap
    }

    .toast{
      position:fixed;
      bottom:22px;
      left:50%;
      transform:translateX(-50%) translateY(80px);
      background:var(--ink);
      color:#fff;
      padding:12px 18px;
      border-radius:4px;
      transition:.25s;
      z-index:5;
      font-size:14px
    }

    .toast.show{
      transform:translateX(-50%) translateY(0)
    }

    .btn{
      text-decoration:none
    }

    .about-photo-wrap{
      position:relative
    }

    .about-photo-edit{
      width:100%;
      border:1.5px solid var(--ink);
      border-top:0;
      padding:6px;
      background:var(--blue);
      cursor:pointer;
      font:17px Gaegu
    }

    .editing [contenteditable="true"]{
      outline:2px dashed #d77b63;
      outline-offset:4px;
      background:#fff4cb;
      cursor:text
    }

    .editing [contenteditable="true"]:focus{
      outline-color:#4c9e9a;
      background:#fff
    }

    .link-row{
      display:grid;
      grid-template-columns:1fr 1.4fr auto;
      gap:7px;
      margin:8px 0
    }

    .link-row input{
      min-width:0
    }

    .remove-link{
      border:1.5px solid var(--ink);
      background:#f5c9c0;
      cursor:pointer;
      padding:0 9px;
      font-family:Gaegu;
      font-size:16px
    }

    .pdf-card{
      margin-top:10px;
      border:1.5px solid var(--ink);
      background:#fffdf6;
      padding:10px;
      text-align:center
    }

    .pdf-card-title{
      font:19px 'Gaegu';
      margin:0 0 7px;
      word-break:break-word
    }

    .pdf-actions{
      display:flex;
      gap:6px;
      justify-content:center;
      flex-wrap:wrap
    }

    .pdf-btn{
      border:1.5px solid var(--ink);
      background:var(--blue);
      padding:6px 9px;
      cursor:pointer;
      font:16px 'Gaegu';
      color:var(--ink)
    }

    .pdf-btn:hover{
      background:var(--yellow)
    }

    .pdf-modal-box{
      width:min(1000px,100%);
      height:min(88vh,900px);
      padding:14px;
      background:var(--paper);
      border:var(--line);
      box-shadow:8px 8px 0 #3d3932;
      display:flex;
      flex-direction:column
    }

    .pdf-viewer{
      width:100%;
      height:100%;
      border:1.5px solid var(--ink);
      background:white
    }

    .pdf-name-input{
      width:100%;
      padding:9px;
      border:1.5px solid var(--ink);
      background:#fffef9;
      font:15px Pretendard;
      margin-top:8px
    }

    /* 프로젝트 사진 */
    .project-photo-wrap{
      margin:14px 0;
      border:1.5px solid var(--ink);
      background:#fff;
      padding:8px;
      text-align:center
    }

    .project-photo{
      display:block;
      width:100%;
      max-height:360px;
      object-fit:contain;
      margin:auto
    }

    .project-photo-empty{
      padding:20px;
      font:17px Gaegu;
      color:#777
    }

    .project-tools{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-top:10px
    }

    /* 프로젝트 모달 스크롤 */
    #projectModal{
      overflow-y:auto;
      align-items:center;
    }

    #projectModal .modal-box{
      max-height:90vh;
      overflow-y:auto;
    }

    @media(max-width:850px){
      .hero{
        grid-template-columns:1fr
      }

      .side{
        border-right:0;
        border-bottom:var(--line);
        flex-direction:row;
        flex-wrap:wrap
      }

      .avatar{
        margin:0 12px 0 0
      }

      .navlink{
        font-size:16px
      }

      .grid{
        grid-template-columns:1fr
      }

      .projects,
      .future{
        grid-column:auto
      }

      .about{
        grid-template-columns:1fr
      }

      .profile-card{
        height:145px
      }

      .doodle{
        font-size:70px
      }

      .name{
        font-size:58px
      }
    }

    @media(max-width:520px){
      .wrap{
        padding:12px
      }

      .brand{
        font-size:33px
      }

      .top{
        align-items:flex-start
      }

      .top-actions{
        flex-direction:column
      }

      .hero-main{
        padding:38px 8%
      }

      .grid{
        gap:13px
      }

      .section{
        padding:18px
      }

      .skills,
      .project-list{
        grid-template-columns:1fr
      }

      .strengths{
        grid-template-columns:repeat(2,1fr)
      }

      .future-path{
        gap:8px;
        font-size:13px
      }

      .future-path b{
        font-size:27px
      }

      .link-row{
        grid-template-columns:1fr auto
      }

      .link-row input:nth-child(2){
        grid-column:1/2
      }

      .remove-link{
        grid-column:2;
        grid-row:1/3
      }
    }
  </style>
</head>

<body>

<!-- 이하 HTML과 JavaScript는 기존 코드 그대로 사용 -->

</body>
</html>
```
